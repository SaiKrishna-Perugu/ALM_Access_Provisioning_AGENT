name: CI

# The whole test suite runs offline: it never reaches EWM, JTS, GPT or LDAP.
# That is deliberate - every check that needed the intranet was, in practice,
# a check nobody ran.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.13 is what the operators run; 3.12 catches accidental 3.13-only syntax.
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt   # requirements.txt + pinned pytest/ruff

      - name: Lint
        run: ruff check src tests .github/hooks/scripts

      - name: Test
        run: pytest

      - name: Assert TLS verification is never hardcoded off
        # verify=False silently disables certificate checking wherever it appears.
        # TLS policy belongs in alm_config.tls_verify() and nowhere else.
        run: |
          if grep -rn --include='*.py' -E 'verify\s*=\s*False' src/ | grep -v '^src/alm_config.py:'; then
            echo "::error::verify=False found outside alm_config - use alm_config.tls_verify()"
            exit 1
          fi
          echo "no hardcoded verify=False in src/"

      - name: Assert every write step is guarded
        # A new --commit entry point that the PreToolUse guard does not recognise
        # would be unguarded exactly the way run_pipeline.py used to be.
        run: |
          python - <<'PY'
          import pathlib, re, sys
          guard = pathlib.Path(".github/hooks/scripts/guard-jts-commit.py").read_text(encoding="utf-8")
          missing = []
          for path in sorted(pathlib.Path("src").glob("*.py")):
              text = path.read_text(encoding="utf-8")
              if not re.search(r'add_argument\(\s*"--commit"', text):
                  continue
              if path.stem not in guard:
                  missing.append(path.stem)
          if missing:
              print("::error::write scripts unknown to the commit guard: " + ", ".join(missing))
              sys.exit(1)
          print("every --commit entry point is known to the guard")
          PY

  # The agent tests skip without the cloud stack, so the job above cannot catch
  # an agent regression. This one installs it. Still offline: the model is
  # scripted and the estate simulated - no Gemini key, no network.
  agents:
    runs-on: ubuntu-latest
    # A real Postgres, so the store contract, the job queue and the multi-worker
    # claims are tested against the database production uses, not only SQLite.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test  # pragma: allowlist secret - throwaway CI container
          POSTGRES_DB: alm
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Install the cloud dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-cloud.txt -r requirements-dev.txt
      - name: Test the multi-agent system end to end
        env:
          # Fail if any checkpointed type is missing from the allowlist.
          LANGGRAPH_STRICT_MSGPACK: "true"
          PG_TEST_DSN: postgresql://postgres:test@localhost:5432/alm  # pragma: allowlist secret
        # Coverage was 54% when the floor was set (2026-09-27); the margin
        # covers Windows-only paths CI does not run. Raise it as tests land.
        run: pytest -q --cov=src --cov-report=term --cov-fail-under=50

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Install security audit tools
        # Pinned in requirements-dev.txt, so CI audits with the same versions as
        # the developer's pre-commit hooks (ruff 0.6.9, not "latest").
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Audit dependencies for known vulnerabilities
        run: pip-audit -r requirements.txt -r requirements-cloud.txt
      - name: Check static security rules
        run: ruff check --select S src
      # Secrets are checked by the `secrets` job below: pre-commit runs
      # detect-secrets-hook, which fails on a new secret. `detect-secrets scan
      # --baseline` does not - it exits 0 and adds the secret to the baseline.

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install pre-commit
        run: pip install pre-commit==4.6.2  # same pin as requirements-dev.txt
      - name: Run the hygiene and secret-detection hooks
        env:
          # The PII guard's denylist is personal data, so it lives in a
          # repository secret (one token per line), never in the repository.
          PII_DENYLIST: ${{ secrets.PII_DENYLIST }}
          # The test jobs above run the suite with its dependencies installed;
          # this job has only pre-commit, so its pytest hook cannot run here.
          SKIP: pytest
        run: pre-commit run --all-files --show-diff-on-failure
