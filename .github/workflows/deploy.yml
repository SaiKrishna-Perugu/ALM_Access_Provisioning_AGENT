name: Deploy

# Build, push and deploy the orchestrator to Google Cloud.
#
# Authentication is Workload Identity Federation - GitHub's OIDC token is
# exchanged for a short-lived Google token. There is no service account key in
# this repository, and `google_service_account_key` does not appear anywhere in
# the Terraform either.
#
# The environment gates matter: `test` deploys on a push to main, `prod` needs a
# GitHub environment approval. Turning shadow mode off is not done here at all -
# it is a deliberate configuration change, made once, with a change record.
#
# Pushes deploy only when the repository variable DEPLOY_ENABLED is "true"
# (Settings > Secrets and variables > Actions > Variables); until then they
# verify and stop.
#
# Each GitHub environment (test, prod) needs these variables (Settings >
# Environments > Variables). They are the real intranet names, so they are
# kept out of the repository; Terraform refuses to apply without them:
#   EWM_SERVER            https://<ewm host>/ccm
#   JTS_SERVER            https://<jts host>/jts
#   CORPORATE_DNS_SUFFIX  <intranet domain>.   (trailing dot)

on:
  push:
    branches: [main]
    paths:
      - 'src/alm_core/**'
      - 'src/alm_agents/**'
      - 'src/alm_api/**'
      - 'src/alm_worker/**'
      - 'infra/**'
      - 'Dockerfile'
      - 'requirements*.txt'
  workflow_dispatch:
    inputs:
      target:
        description: Environment to deploy
        type: choice
        options: [test, prod]
        default: test

permissions:
  id-token: write      # OIDC to Google
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: alm-provisioning
  # Scanners run as images pinned by digest, not as third-party actions.
  TRIVY: aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa
  SYFT: anchore/syft:v1.54.0@sha256:0356562f495d432056237fbea5cbc2d4839c9c75cd500784a66de2e7cc95ca7c
  # Only an image this workflow built from main may be deployed.
  SIGNER: https://github.com/${{ github.repository }}/.github/workflows/deploy.yml@refs/heads/main
  ISSUER: https://token.actions.githubusercontent.com

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.13'
          cache: pip
      - name: Install
        # The cloud set, so the agent tests run rather than skip before a deploy.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-cloud.txt -r requirements-dev.txt
      - name: Lint
        run: ruff check src tests .github/hooks/scripts
      - name: Test
        run: pytest

      - name: Assert the agent guardrails are intact
        # Agents call write tools directly, so the guarantees live in the tool
        # boundary. Two things must stay true, and both are cheap to check.
        run: |
          # 1. The tool layer never reasons. If alm_core imports the LLM layer,
          #    a model has been given a way to act without passing the policy.
          if grep -rn "alm_agents.llm\|from .. import llm\|^import llm" src/alm_core/ ; then
            echo "::error::alm_core must not import the LLM layer"
            exit 1
          fi
          # 2. Every tool marked is_write must be known to the policy engine as a
          #    write. A write tool the policy does not recognise is one an agent
          #    could call without an approval check.
          python - <<'PY'
          import pathlib, re, sys
          toolkit = pathlib.Path("src/alm_agents/toolkit.py").read_text(encoding="utf-8")
          policy = pathlib.Path("src/alm_agents/policy.py").read_text(encoding="utf-8")
          declared = set(re.findall(r'ToolSpec\(\s*"([a-z_]+)"[^)]*?is_write=True',
                                    toolkit, re.S))
          guarded = set(re.findall(r'^\s+"([a-z_]+)",\s*$',
                                   policy.split("WRITE_TOOLS = {")[1].split("}")[0], re.M))
          missing = declared - guarded
          if missing:
              print("::error::write tools unknown to the policy engine: "
                    + ", ".join(sorted(missing)))
              sys.exit(1)
          print(f"{len(declared)} write tool(s), all policy-guarded")
          PY

      - name: Assert no service account key is ever created
        # A downloaded key is the credential most likely to end up committed.
        # Every principal in this system federates instead.
        run: |
          # A resource or data declaration, not any mention: iam.tf's comment
          # explaining that no key exists would otherwise fail this check.
          if grep -rnE '^\s*(resource|data)\s+"google_service_account_key"' infra/ ; then
            echo "::error::use Workload Identity Federation, not a downloaded key"
            exit 1
          fi
          echo "no service account keys in the Terraform"

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.9.8
      - name: Is deploying switched on?
        if: vars.DEPLOY_ENABLED != 'true' && github.event_name != 'workflow_dispatch'
        run: echo "::notice::DEPLOY_ENABLED is not 'true'; verified only, nothing deployed."

      - name: Validate Terraform (GCP, and the AWS and Azure skeletons)
        run: |
          terraform fmt -check -recursive infra
          for cloud in gcp aws azure; do
            terraform -chdir=infra/$cloud init -backend=false -input=false
            terraform -chdir=infra/$cloud validate
          done

  build:
    needs: verify
    # A push deploys only once the repository variable DEPLOY_ENABLED is
    # "true" - set it after the cloud project, the secrets and the variables
    # below exist. Until then a push verifies and stops, rather than failing
    # at sign-in. A manual run always proceeds (and fails loudly if unset).
    if: vars.DEPLOY_ENABLED == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.target || 'test' }}
    outputs:
      api_image: ${{ steps.push.outputs.api }}
      worker_image: ${{ steps.push.outputs.worker }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - id: auth
        uses: google-github-actions/auth@71f986410dfbc7added4569d411d040a91dc6935 # v2.1.8
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@6189d56e4096ee891640bb02ac264be376592d6a # v2.1.2

      - name: Write the corporate CA bundle
        # Held as a repository secret rather than committed: it is not secret in
        # the cryptographic sense, but publishing an organisation's internal PKI
        # layout is free reconnaissance.
        run: |
          mkdir -p certs
          printf '%s' "${{ secrets.CORPORATE_CA_BUNDLE }}" > certs/corporate-ca.pem
          test -s certs/corporate-ca.pem

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Build
        id: build
        # Two images: the API (no browser, no workers) and the run worker
        # (Chromium for evidence). Terraform runs them as two services.
        run: |
          TARGET="${{ github.event.inputs.target || 'test' }}"
          REGISTRY="${{ secrets.GCP_REGION }}-docker.pkg.dev"
          REPO="$REGISTRY/${{ secrets.GCP_PROJECT_ID }}/alm-$TARGET-images"
          TAG="${GITHUB_SHA::12}"
          for image in api worker; do
            docker build --target "$image" --build-arg CA_BUNDLE=certs/corporate-ca.pem \
              -t "$REPO/$IMAGE_NAME-$image:$TAG" .
            echo "$image=$REPO/$IMAGE_NAME-$image:$TAG" >> "$GITHUB_OUTPUT"
          done
          echo "registry=$REGISTRY" >> "$GITHUB_OUTPUT"

      - name: Scan - a fixable HIGH or CRITICAL vulnerability stops the deploy
        run: |
          for ref in "${{ steps.build.outputs.api }}" "${{ steps.build.outputs.worker }}"; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY" image \
              --quiet --scanners vuln --severity CRITICAL,HIGH --ignore-unfixed \
              --exit-code 1 "$ref"
          done

      - name: SBOMs
        env:
          API: ${{ steps.build.outputs.api }}
          WORKER: ${{ steps.build.outputs.worker }}
        run: |
          for image in api worker; do
            ref="$API"; [ "$image" = worker ] && ref="$WORKER"
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              -v "$PWD:/out" "$SYFT" "docker:$ref" -o "spdx-json=/out/sbom-$image.spdx.json"
            test -s "sbom-$image.spdx.json"
          done

      - name: Push
        id: push
        env:
          API: ${{ steps.build.outputs.api }}
          WORKER: ${{ steps.build.outputs.worker }}
        run: |
          gcloud auth configure-docker "${{ steps.build.outputs.registry }}" --quiet
          for image in api worker; do
            ref="$API"; [ "$image" = worker ] && ref="$WORKER"
            docker push "$ref"
            # Deploy by digest, never by tag: a tag can move under a running
            # revision, a digest cannot.
            digest=$(gcloud artifacts docker images describe "$ref" \
              --format='value(image_summary.digest)')
            echo "$image=${ref%:*}@$digest" >> "$GITHUB_OUTPUT"
          done

      - name: Sign, and attach each SBOM as a signed attestation
        # Keyless: the signature is bound to this workflow's GitHub identity
        # through Sigstore. There is no signing key to store or leak.
        env:
          API: ${{ steps.push.outputs.api }}
          WORKER: ${{ steps.push.outputs.worker }}
        run: |
          cosign sign --yes "$API"
          cosign attest --yes --type spdxjson --predicate sbom-api.spdx.json "$API"
          cosign sign --yes "$WORKER"
          cosign attest --yes --type spdxjson --predicate sbom-worker.spdx.json "$WORKER"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom
          path: sbom-*.spdx.json
          retention-days: 90

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.target || 'test' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: google-github-actions/auth@71f986410dfbc7added4569d411d040a91dc6935 # v2.1.8
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@6189d56e4096ee891640bb02ac264be376592d6a # v2.1.2
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.9.8
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Verify both images' signatures and SBOM attestations
        # An image not signed by this workflow on main is not deployed, whoever
        # pushed it to the registry.
        run: |
          for IMAGE in "${{ needs.build.outputs.api_image }}" "${{ needs.build.outputs.worker_image }}"; do
            gcloud auth configure-docker "${IMAGE%%/*}" --quiet
            cosign verify "$IMAGE" --certificate-identity "$SIGNER" \
              --certificate-oidc-issuer "$ISSUER" > /dev/null
            cosign verify-attestation "$IMAGE" --type spdxjson \
              --certificate-identity "$SIGNER" --certificate-oidc-issuer "$ISSUER" > /dev/null
            echo "$IMAGE: signed by $SIGNER"
          done

      - name: Terraform apply
        run: |
          TARGET="${{ github.event.inputs.target || 'test' }}"
          terraform -chdir=infra/gcp init \
            -backend-config="bucket=${{ secrets.GCP_TF_STATE_BUCKET }}" \
            -backend-config="prefix=alm/$TARGET"
          # Intranet host names are GitHub environment variables, not committed:
          # the variables' validation fails the apply if one is missing.
          terraform -chdir=infra/gcp apply -auto-approve -input=false \
            -var-file="envs/$TARGET.tfvars" \
            -var="project_id=${{ secrets.GCP_PROJECT_ID }}" \
            -var="container_image=${{ needs.build.outputs.api_image }}" \
            -var="worker_image=${{ needs.build.outputs.worker_image }}" \
            -var="ewm_server=${{ vars.EWM_SERVER }}" \
            -var="jts_server=${{ vars.JTS_SERVER }}" \
            -var="corporate_dns_suffix=${{ vars.CORPORATE_DNS_SUFFIX }}"

      - name: Connectivity smoke test
        # A green apply proves the resources exist. It proves nothing about
        # whether the container can reach EWM and JTS over the interconnect -
        # which is the thing most likely to be wrong after an infra change.
        run: |
          TARGET="${{ github.event.inputs.target || 'test' }}"
          RUN_SA=$(terraform -chdir=infra/gcp output -raw run_service_account)
          gcloud run jobs deploy "alm-$TARGET-smoke" \
            --region "${{ secrets.GCP_REGION }}" \
            --image "${{ needs.build.outputs.worker_image }}" \
            --service-account "$RUN_SA" \
            --network "alm-$TARGET-vpc" \
            --subnet "alm-$TARGET-run" \
            --vpc-egress all-traffic \
            --set-env-vars "ALM_ENVIRONMENT=$(echo "$TARGET" | tr a-z A-Z)" \
            --command python \
            --args=-m,alm_core.smoke \
            --quiet
          gcloud run jobs execute "alm-$TARGET-smoke" \
            --region "${{ secrets.GCP_REGION }}" --wait || {
              echo "::error::connectivity smoke test failed - check Cloud DNS forwarding and the interconnect"
              exit 1
            }

      - name: Synthetic dry run, end to end
        # Only where the environment sets synthetic_work_item (TEST). Queues a
        # dry run of that work item; the workers sign in, ask the model and
        # plan it. Writes nothing. The run shows in the console as synthetic-*.
        run: |
          JOB=$(terraform -chdir=infra/gcp output -raw synthetic_job)
          if [ -z "$JOB" ]; then
            echo "no synthetic_work_item for this environment; skipped"
            exit 0
          fi
          gcloud run jobs execute "$JOB" --region "${{ secrets.GCP_REGION }}" --wait
