name: Image

# Builds the api and worker images on every change that could alter them, and
# proves three things before a deploy ever tries:
#   - they build (with a throwaway CA in place of the corporate one);
#   - no fixable HIGH or CRITICAL vulnerability is in them;
#   - they run as a non-root user on a read-only root filesystem, /tmp only.
on:
  pull_request:
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'requirements*.txt'
      - 'src/**'
      - '.github/workflows/image.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  TRIVY: aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: A throwaway CA in place of the corporate bundle
        run: |
          mkdir -p certs
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj "/CN=ci-throwaway-ca" \
            -keyout "$RUNNER_TEMP/ca.key" -out certs/corporate-ca.pem 2>/dev/null

      - name: Build
        run: |
          docker build --target api -t alm-api:ci .
          docker build --target worker -t alm-worker:ci .

      - name: Scan - fixable HIGH and CRITICAL fail the build
        run: |
          for image in alm-api:ci alm-worker:ci; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY" image \
              --quiet --scanners vuln --severity CRITICAL,HIGH --ignore-unfixed \
              --exit-code 1 "$image"
          done

      - name: The api serves read-only, as a non-root user
        run: |
          docker run -d --name api --read-only --tmpfs /tmp -p 8080:8080 \
            -e ALM_ORCHESTRATION=deterministic -e ALM_SHADOW_MODE=true \
            -e ALM_ENVIRONMENT=TEST alm-api:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/healthz; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8080/healthz
          test "$(docker exec api id -u)" = "10001"
          if docker exec api sh -c 'touch /app/x' 2>/dev/null; then
            echo "::error::the root filesystem is writable"; exit 1
          fi
          if docker exec api python -m pip --version 2>/dev/null; then
            echo "::error::pip is in the runtime image"; exit 1
          fi

      - name: Chromium starts in the worker, read-only, as a non-root user
        run: |
          docker run --rm --read-only --tmpfs /tmp alm-worker:ci python -c "
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page()
              page.set_content('<p>ok</p>')
              page.screenshot(path='/tmp/shot.png')
              browser.close()
          print('chromium ok')
          "

      - name: Logs on failure
        if: failure()
        run: docker logs api || true
