name: Evals

# Every built-in scenario - including the prompt-injection ones - against the
# real model, every night and on demand. The PR suite (ci.yml) replays the
# same grading with a scripted model; this is where a prompt, roster or model
# change meets the model it will run on.
#
# Needs the repository secret GEMINI_API_KEY (a key for a non-production
# project). Without it the job says so and passes: forks and new clones stay
# green.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      model:
        description: "Override ALM_AGENT_MODEL (empty: the default)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: evals
  cancel-in-progress: false

jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ALM_LLM_PROVIDER: gemini_api
    steps:
      - name: Is there a model key?
        id: key
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::notice::GEMINI_API_KEY is not set; the nightly evals are skipped."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        if: steps.key.outputs.present == 'true'

      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        if: steps.key.outputs.present == 'true'
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        if: steps.key.outputs.present == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-cloud.txt -r requirements.txt

      - name: Run the evals
        if: steps.key.outputs.present == 'true'
        env:
          MODEL: ${{ inputs.model }}
        run: |
          if [ -n "$MODEL" ]; then
            python src/agent_eval.py --model "$MODEL"
          else
            python src/agent_eval.py
          fi

      - name: Summary
        if: always() && steps.key.outputs.present == 'true'
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob, json
          files = sorted(glob.glob("out/evals/eval-*.json"))
          if not files:
              print("No eval results were written.")
              raise SystemExit
          data = json.load(open(files[-1], encoding="utf-8"))
          s = data["summary"]
          print(f"### Evals: {s['passed']}/{s['total']} passed\n")
          print(f"Model `{data['provider']}:{data['model']}`, {data['orchestration']}, "
                f"version `{data['version']}`. {s['tokens']:,} tokens, "
                f"{s['model_calls']} model calls.\n")
          print("| Scenario | Result | Model calls | Tokens |")
          print("|---|---|---|---|")
          for r in data["results"]:
              m = r["metrics"] or {}
              print(f"| {r['scenario']} | {'pass' if r['passed'] else 'FAIL'} | "
                    f"{m.get('model_calls', '')} | {m.get('tokens', '')} |")
          PY

      - name: Keep the results
        if: always() && steps.key.outputs.present == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: eval-results
          path: out/evals/eval-*.json
          retention-days: 30
