# `pre-commit install` installs both hook types. Hooks run at commit time
# unless they name another stage (no-push-to-main runs only on push).
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]

repos:
  # 1. Standard Built-in Git Safety Checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: check-yaml
      - id: check-json
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict
      # Prevents accidental commit of actual private keys
      - id: detect-private-key

  # 2. Advanced Secret Detection (Yelp detect-secrets)
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: >
          (?x)^(
            out/.*|
            wheels/.*|
            chrome-debug/.*|
            \.venv/.*|
            \.git/.*
          )$

  # 3. Lint the Python sources (config in pyproject.toml)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: ['--fix']
        files: ^(src|tests|\.github/hooks/scripts)/.*\.py$

  # 4. Local hygiene and safety guards
  - repo: local
    hooks:
      - id: guard-pii
        name: guard-pii (PII, hostnames, and file hygiene)
        entry: python .github/hooks/scripts/guard-pii.py
        language: system
        stages: [pre-commit]

      - id: no-push-to-main
        name: no direct push to main (use a pull request)
        entry: python .github/hooks/scripts/no-push-to-main.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: pytest
        name: pytest (offline suite)
        entry: python -m pytest
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
